version: 2
updates:
    - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Tijuana"
    open-pull-requests-limit: 5
    labels: ["dependencies","go"]
    commit-message:
      prefix: "chore"
      include: "scope"

    - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies","github-actions"]
