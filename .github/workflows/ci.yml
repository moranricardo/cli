name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'

      - name: Go tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1

      - run: echo "ci v0.5.9-lite 0 vuln - d649554"
