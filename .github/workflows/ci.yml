name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Go tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Go vet
        run: go vet ./...

      - name: Build lite
        run: go build -o /tmp/dependabot ./cmd/dependabot

      - name: Test
        run: go test ./... -count=1 -short
