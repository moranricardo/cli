name: CI Build + Unit Test

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML
        run: yamllint .

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          go version
          go build -v ./...

      - name: Test
        run: go test -shuffle=on -count=2 -race -cover -timeout=5m ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod tidy
        run: |
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "gofmt failed on:"
            echo "$fmt"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Check go mod
        run: go list -m all
