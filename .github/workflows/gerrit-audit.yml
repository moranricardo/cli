name: Gerrit Automated Audit

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 */6 * * *' # cada 6 horas
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gerrit-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f yarn.lock ]; then yarn --frozen-lockfile
          elif [ -f package.json ]; then npm install
          fi

      - name: Run Gerrit Audit Script
        run: node index.js
