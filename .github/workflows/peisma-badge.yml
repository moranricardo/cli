name: peisma-badge
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: check
        id: s
        run: |
          go vet./... > /tmp/vet.log 2>&1; VET=$?
          go test./... > /tmp/test.log 2>&1; TEST=$?
          if [ $TEST -ne 0 ]; then
            echo "color=red" >> $GITHUB_OUTPUT
            echo "msg=error" >> $GITHUB_OUTPUT
          elif [ $VET -ne 0 ]; then
            echo "color=orange" >> $GITHUB_OUTPUT
            echo "msg=warning" >> $GITHUB_OUTPUT
          else
            echo "color=brightgreen" >> $GITHUB_OUTPUT
            echo "msg=ok" >> $GITHUB_OUTPUT
          fi

      - name: make badge
        run: |
          echo "{\"schemaVersion\":1,\"label\":\"peisma\",\"message\":\"${{ steps.s.outputs.msg }}\",\"color\":\"${{ steps.s.outputs.color }}\"}" > badge.json

      - name: publish badges branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir:.
          destination_dir:.
