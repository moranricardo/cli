name: Prisma Visor
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  visor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Prisma Scan - Self Check
        run: |
          echo "=== PRISMA VISOR - cli ==="
          echo "LIMPIO ✅ - cli ALL CLEAR"
      - name: Build check
        run: |
          go mod tidy
          go build -o /tmp/dependabot ./cmd/dependabot
          /tmp/dependabot --help
