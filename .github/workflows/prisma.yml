name: prisma
on:
  push:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prisma Validate
        run: |
          if [ -f schema.prisma ] || [ -d prisma ]; then
            npx prisma validate
          fi
