name: Release
on:
  release:
    types: [published]
permissions: read-all
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.23'
          cache: true

      - uses: wangyoucao577/go-release-action@v1.55
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goarm: ${{ matrix.goarm }}
          binary_name: cli
          project_path: ./cmd/dependabot
          ldflags: -X github.com/moranricardo/cli/cmd/dependabot/internal/cmd.version=${{ github.event.release.tag_name }}
          extra_files: LICENSE README.md
          retry: 10
