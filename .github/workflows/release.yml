name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - uses: wangyoucao577/go-release-action@v1.55
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goarm: ${{ matrix.goarm }}
          binary_name: cli
          project_path:./cmd/dependabot
          ldflags: -s -w -X github.com/moranricardo/cli/cmd/dependabot/internal/cmd.version=${{ github.event.release.tag_name }}
          extra_files: LICENSE README.md
          retry: 10
