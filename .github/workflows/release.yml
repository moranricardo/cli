name: Release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name || github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      - uses: wangyoucao577/go-release-action@v1.55
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goarm: ${{ matrix.goarm }}
          goversion: https://dl.google.com/go/go1.23.0.linux-amd64.tar.gz
          binary_name: cli
          project_path: ./cmd/dependabot
          ldflags: -s -w -X main.version=${{ inputs.tag || github.ref_name || github.event.release.tag_name }}
          extra_files: LICENSE README.md
          retry: 10
          overwrite: true
          release_name: ${{ inputs.tag || github.ref_name || github.event.release.tag_name }}
          release_tag: ${{ inputs.tag || github.ref_name || github.event.release.tag_name }}
