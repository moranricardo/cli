name: SMA - Monitor Fantasma
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - id: scan
        name: Scan
        run: |
          STATUS="passing"
      COLOR="brightgreen"
      if ! go vet ./...; then
        STATUS="failing"
        COLOR="red"
      fi
      echo "status=$STATUS" >> $GITHUB_OUTPUT
      echo "color=$COLOR" >> $GITHUB_OUTPUT
      - name: Badge
        run: |
          STATUS="${{ steps.scan.outputs.status }}"
          COLOR="${{ steps.scan.outputs.color }}"
      sed -i "s|\[sistema\](.*)|[sistema](https://img.shields.io/badge/sistema-${STATUS}-${COLOR})|g" README.md
          git config user.name "SMA-Bot"
          git config user.email "sma@bot.local"
      git add README.md
      git diff --quiet && git diff --staged --quiet || git commit -m "chore(sma): sistema -> $STATUS"
      git push
