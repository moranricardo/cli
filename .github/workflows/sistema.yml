name: sistema
on:
  push:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - name: Go Vet
        run: go vet ./...
      - name: Go Test
        run: go test ./... || echo "no tests yet"
