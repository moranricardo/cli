name: Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - id: gather
        run: |
          URL="https://api.github.com/repos/dependabot/smoke-tests/git/trees/main?recursive=1"
          DATA="$(curl -s $URL | jq -r '.tree[] | select(.path | startswith("tests/smoke-")) | .path' | sed 's/tests\/smoke-//' | sed 's/\.yaml$//' | jq -R . | jq -sc .)"
          echo "suite=$DATA" >> $GITHUB_OUTPUT
    outputs:
      suites: ${{ steps.gather.outputs.suite }}

  smoke:
    runs-on: ubuntu-latest
    needs: suites
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.suites) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download --repo dependabot/smoke-tests --name "cache-${{ matrix.suite }}" --dir cache || true

      - name: ${{ matrix.suite }}
        env:
          LOCAL_GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gh api "repos/dependabot/smoke-tests/contents/tests/smoke-${{ matrix.suite }}.yaml" -H "Accept: application/vnd.github.raw" > smoke.yaml
          go run cmd/dependabot/dependabot.go test \
            -f=smoke.yaml \
            -o=result.yaml \
            --cache=cache \
            --timeout 20m \
            2>&1 | tee -a log.txt

      - name: Diff
        if: always()
        continue-on-error: true
        run: diff --ignore-space-change smoke.yaml result.yaml && echo "Contents are identical" || exit 0

      - name: Create summary
        run: tail -n100 log.txt | grep -P '\d+/\d+ calls cached \(\d+%\)' >> $GITHUB_STEP_SUMMARY
