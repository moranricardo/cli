echo -e "name: Smoke\n\non:\n  workflow_dispatch:\n  pull_request:\n    branches: [ \"main\" ]\n\npermissions:\n  contents: read\n\nenv:\n  GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}\n\njobs:\n  suites:\n    runs-on: ubuntu-latest\n    steps:\n      - id: gather\n        run: |\n          URL=\"https://api.github.com/repos/dependabot/smoke-tests/contents/tests\"\n          DATA=\"\$(gh api \$URL | jq -r '.[].name'  | sed 's/smoke-//' | sed 's/.yaml\$//' | jq -R | jq -sc)\"\n          echo \"suite=\$DATA\" >> \$GITHUB_OUTPUT\n    outputs:\n      suites: \${{ steps.gather.outputs.suite }}\n      \n  smoke:\n    runs-on: ubuntu-latest\n    needs: suites\n    strategy:\n      fail-fast: false\n      matrix:\n        suite: \${{ fromJSON(needs.suites.outputs.suites) }}\n    steps:\n      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683\n\n      - name: Set up Go\n        uses: actions/setup-go@f111f3307d8844f561af10f8b47ed8416042f386\n        with:\n          go-version-file: go.mod\n\n      - name: Download cache\n        run: |\n          gh run download --repo dependabot/smoke-tests --name cache-\${{ matrix.suite }} --dir cache\n\n      - name: \${{ matrix.suite }}\n        env:\n          LOCAL_GITHUB_ACCESS_TOKEN: \${{ secrets.GITHUB_TOKEN }}\n        run: |\n          set -o pipefail\n          gh api \"repos/dependabot/smoke-tests/contents/tests/smoke-\${{ matrix.suite }}.yaml\" -H \"Accept: application/vnd.github.raw\" > smoke.yaml\n          go run cmd/dependabot/dependabot.go test \\\n            -f=smoke.yaml \\\n            -o=result.yaml \\\n            --cache=cache \\\n            --timeout 20m \\\n            2>&1 | tee -a log.txt\n\n      - name: Diff\n        if: always()\n        continue-on-error: true\n        run: diff --ignore-space-change smoke.yaml result.yaml && echo \"Contents are identical\" || exit 0\n\n      - name: Create summary\n        run: tail -n100 log.txt | grep -P '\\d+/\\d+ calls cached \\(\\d+%\\)' >> \$GITHUB_STEP_SUMMARY" > .github/workflows/smoke.yml
