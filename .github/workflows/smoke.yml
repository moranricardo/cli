name: Smoke

'on':
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  actions: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  suites:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.gather.outputs.suite }}
    steps:
      - id: gather
        run: |
          set -euo pipefail
          URL="https://api.github.com/repos/dependabot/smoke-tests/git/trees/main?recursive=1"
          DATA="$(curl -sS "$URL" | jq -r '.tree[] | select(.path | startswith("tests/smoke-")) | .path' | sed 's/tests\/smoke-//' | sed 's/\.yaml$//' | jq -R . | jq -sc .)"
          echo "suite=$DATA" >> "$GITHUB_OUTPUT"

  smoke:
    runs-on: ubuntu-latest
    needs: suites
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.suites.outputs.suites) }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8e # v4.3.0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c1d6d55fbed # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download cache
        continue-on-error: true
        run: |
          gh run download --repo dependabot/smoke-tests --name "cache-${{ matrix.suite }}" --dir cache || true

      - name: Run suite (${{ matrix.suite }})
        env:
          LOCAL_GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/dependabot/smoke-tests/contents/tests/smoke-${{ matrix.suite }}.yaml" -H "Accept: application/vnd.github.raw" > smoke.yaml
          go run ./cmd/dependabot test \
            -f=smoke.yaml \
            -o=result.yaml \
            --cache=cache \
            --timeout 20m \
            2>&1 | tee -a log.txt

      - name: Diff
        if: always()
        continue-on-error: true
        run: diff --ignore-space-change smoke.yaml result.yaml && echo "Contents are identical" || exit 0

      - name: Create summary
        if: always()
        run: |
          if [ -f log.txt ]; then
            tail -n100 log.txt | grep -P '\d+/\d+ calls cached \(\d+%\)' >> "$GITHUB_STEP_SUMMARY" || true
          fi
