version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - prealloc
    - revive
    - staticcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-same-issues: 0
  exclude-dirs:
    - testdata
    - tmp
    - cache

run:
  timeout: 5m
  modules-download-mode: readonly
