version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - prealloc
    - revive
    - staticcheck
    - govet
  settings:
    gosec:
      excludes:
        - G115 # integer overflow conversion - false positive in Go 1.22+
        - G306 # poor file perms false positive on tests
    govet:
      enable:
        - shadow
        - fieldalignment

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-same-issues: 0
  exclude-dirs:
    - testdata
    - tmp
    - cache
    - vendor

run:
  timeout: 5m
  allow-serial-runners: true

output:
  formats:
    - format: colored-line-number
