job:
  id: "basic-test"
  package-manager: go_modules
  allowed-updates:
    - dependency-type: direct
      update-type: all
  source:
    provider: github
    repo: dependabot/cli
    directory: /
    hostname: github.com
    api-endpoint: https://api.github.com
  experiments:
    enable_record_ecosystem_versions: true
credentials:
  - type: git_source
    host: github.com
    username: x-access-token
    password: $LOCAL_GITHUB_ACCESS_TOKEN
