job:
  id: "invalid-commit-test"
  package-manager: go_modules
  allowed-updates:
    - dependency-type: direct
      update-type: all
  source:
    provider: github
    repo: dependabot/cli
    directory: /
    hostname: github.com
    api-endpoint: https://api.github.com
    commit: unknown
  experiments:
    enable_record_ecosystem_versions: true
