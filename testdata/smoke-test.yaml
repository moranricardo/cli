---
name: smoke-test-go-modules
meta:
  description: Basic smoke test for go_modules updater
job:
  id: smoke-test-go-modules
  package-manager: go_modules
  allowed-updates:
    - dependency-type: direct
      update-type: all
  source:
    provider: github
    repo: dependabot/cli
    directory: /
    hostname: github.com
    api-endpoint: https://api.github.com
  experiments:
    enable_record_ecosystem_versions: true
